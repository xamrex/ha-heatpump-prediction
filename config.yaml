name: "Heat Pump prediction"
version: "4.49"
slug: "pompa_addon"
description: >-
  Trains and runs Random Forest / Linear Regression models to predict your
  heat pump's daily energy consumption from temperature, humidity, and
  weather forecast history. Before starting the add-on, open its
  Configuration tab and set the required sensor entities.


  Required sensors:

  1. Current temperature sensor

  2. Heat pump daily energy consumption sensor

  3. Forecast temperature sensor

  4. Current humidity sensor


  TIP: You can add the Meteorologisk institutt (Met.no) integration to get a
  forecast temperature sensor. For current humidity, you can create a
  template helper using {{ state_attr('weather.<your_weather_entity>',
  'humidity') }} to read the current humidity from your weather entity.
arch:
  - aarch64
  - amd64
map:
  - config:rw
ports:
  8000/tcp: 8234
panel_icon: mdi:pump
panel_title: Pompa
ingress: true
ingress_port: 8000
homeassistant_api: true
options:
  energy_consumption_sensor: ""
  weather_forecast: ""
  temp_sensor: ""
  humidity_sensor: ""
schema:
  energy_consumption_sensor: str?
  weather_forecast: str?
  temp_sensor: str?
  humidity_sensor: str?